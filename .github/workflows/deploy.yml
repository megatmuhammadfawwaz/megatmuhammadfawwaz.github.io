name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Least privilege by default; the deploy job opts in to what it needs.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      # Dependabot keeps these pins up to date.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Allowlist: only these paths are published. Anything else in the
      # repo (tooling config, notes, originals) never reaches the site.
      - name: Validate CEH account configuration
        if: ${{ hashFiles('ceh/sync-config.js') != '' }}
        run: node tools/ceh-sync/validate-config.cjs

      - name: Assemble public site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html 404.html robots.txt sitemap.xml css js assets .well-known _site/
          # Temporary private CEH study vault (encrypted). Delete ceh/ to disable.
          if [ -d ceh ]; then cp -r ceh _site/; fi
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true # needed for /.well-known/security.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
